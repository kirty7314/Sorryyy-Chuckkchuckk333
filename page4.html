<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Melon & Musk 🐰💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #ffeaa7 0%, #fab1a0 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            border: 3px solid #ff7675;
            position: relative;
            overflow: hidden;
        }

        /* Rabbit image borders */
        .rabbit-top-left {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 182, 193, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.8;
            animation: float 3s ease-in-out infinite;
        }

        .rabbit-top-right {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: rgba(255, 182, 193, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.8;
            animation: float 3.5s ease-in-out infinite;
        }

        .rabbit-bottom-left {
            position: absolute;
            bottom: 15px;
            left: 15px;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(255, 182, 193, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.8;
            animation: float 4s ease-in-out infinite;
        }

        .rabbit-bottom-right {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: rgba(255, 182, 193, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.8;
            animation: float 3.2s ease-in-out infinite;
        }

        .rabbit-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .content {
            position: relative;
            z-index: 10;
            text-align: center;
        }

        .header {
            font-size: 2.5em;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ff7675, #fab1a0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: bold;
        }
