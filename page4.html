<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Poem</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #2a1a3e 0%, #1a1a2e 100%);
            height: 100vh;
        }

        .page {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Floating Hearts */
        .hearts-container {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .heart {
            position: absolute;
            font-size: 28px;
            opacity: 0.5;
            animation: float-up 8s ease-in-out forwards;
        }

        @keyframes float-up {
            0% {
                opacity: 0;
                transform: translateY(0) translateX(0) scale(1);
            }
            50% {
                opacity: 0.6;
            }
            100% {
                opacity: 0;
                transform: translateY(-100vh) translateX(40px) scale(0.3);
            }
        }

        /* Rabbit Image */
        .rabbit-image {
            position: absolute;
            bottom: 30px;
            left: 50px;
            font-size: 85px;
            animation: gentle-hop 3s ease-in-out infinite;
        }

        @keyframes gentle-hop {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-25px);
            }
        }

        /* Main Poetry Area */
        .poetry-container {
            text-align: center;
            z-index: 10;
            max-width: 700px;
            animation: poem-fade-in 2s ease-out;
        }

        @keyframes poem-fade-in {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .poem {
            font-size: 1.8rem;
            color: #e8b4d4;
            line-height: 2.2;
            margin-bottom: 50px;
            font-weight: 300;
            letter-spacing: 0.5px;
            animation: text-reveal 3s ease-out;
        }

        @keyframes text-reveal {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .poem-line {
            margin: 20px 0;
            animation: line-in 1.2s ease-out backwards;
        }

        .poem-line:nth-child(1) { animation-delay: 0.3s; }
        .poem-line:nth-child(2) { animation-delay: 0.6s; }
        .poem-line:nth-child(3) { animation-delay: 0.9s; }
        .poem-line:nth-child(4) { animation-delay: 1.2s; }
        .poem-line:nth-child(5) { animation-delay: 1.5s; }

        @keyframes line-in {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .final-line {
            margin-top: 60px;
            font-size: 1.5rem;
            font-style: italic;
            color: #f5d5eb;
            animation: final-glow 4s ease-in-out infinite;
        }

        @keyframes final-glow {
            0%, 100% {
                text-shadow: 0 0 0px rgba(232, 180, 212, 0);
            }
            50% {
                text-shadow: 0 0 15px rgba(232, 180, 212, 0.5);
            }
        }

        .nav-buttons {
            position: absolute;
            bottom: 40px;
            display: flex;
            gap: 20px;
        }

        .btn {
            padding: 12px 35px;
            font-size: 1rem;
            border: 2px solid #e8b4d4;
            background: transparent;
            color: #e8b4d4;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            font-weight: 500;
        }

        .btn:hover {
            background: rgba(232, 180, 212, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(232, 180, 212, 0.2);
        }

        .btn-back {
            border-color: #888;
            color: #888;
        }

        .btn-back:hover {
            background: rgba(136, 136, 136, 0.1);
            box-shadow: 0 8px 25px rgba(136, 136, 136, 0.2);
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="hearts-container" id="heartsContainer"></div>
        
        <div class="poetry-container">
            <div class="poem">
                <div class="poem-line">I know I can't undo what's done,</div>
                <div class="poem-line">But every day I'm learning from</div>
                <div class="poem-line">The hurt I caused, the tears I see,</div>
                <div class="poem-line">And all the ways I let you down from me.</div>
                <div class="poem-line">But if you'd give me just one more chance,</div>
            </div>
            <div class="final-line">I promise to be better for you. 💝</div>
        </div>

        <div class="rabbit-image">🐰</div>

        <div class="nav-buttons">
            <a href="page3.html" class="btn btn-back">Back</a>
            <a href="index.html" class="btn">Start Over</a>
        </div>
    </div>

    <script>
        // Generate floating hearts
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.textContent = '❤️';
            
            const randomX = Math.random() * window.innerWidth;
            const randomDelay = Math.random() * 2;
            
            heart.style.left = randomX + 'px';
            heart.style.top = window.innerHeight + 'px';
            heart.style.animationDelay = randomDelay + 's';
            
            document.getElementById('heartsContainer').appendChild(heart);
            
            setTimeout(() => heart.remove(), 10000);
        }

        // Create hearts at intervals
        setInterval(createHeart, 700);
        
        // Create initial hearts
        for (let i = 0; i < 4; i++) {
            setTimeout(() => createHeart(), i * 250);
        }
    </script>
</body>
</html>
