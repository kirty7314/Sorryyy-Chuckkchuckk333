<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I'm So Sorry</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            overflow: hidden;
            background: linear-gradient(180deg, #ffe4f0 0%, #ffd1e8 50%, #ffb8dd 100%);
            height: 100vh;
        }

        .page {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Rain Particles with colors */
        .rain-container {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .raindrop {
            position: absolute;
            width: 3px;
            height: 15px;
            background: linear-gradient(to bottom, rgba(255, 182, 193, 0.9), transparent);
            animation: fall 1s linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10px);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(100vh);
                opacity: 0;
            }
        }

        /* 3D Cute Cat - Clingy version */
        .bunny {
            position: absolute;
            bottom: 40px;
            left: 40px;
            font-size: 90px;
            animation: clingy-hop 2.5s ease-in-out infinite, clingy-rotate 4s ease-in-out infinite;
            filter: drop-shadow(0 10px 25px rgba(255, 130, 206, 0.4));
        }

        @keyframes clingy-hop {
            0%, 100% {
                transform: translateY(0) translateX(0);
            }
            50% {
                transform: translateY(-30px) translateX(15px);
            }
        }

        @keyframes clingy-rotate {
            0%, 100% {
                transform: rotateZ(-5deg);
            }
            50% {
                transform: rotateZ(5deg);
            }
        }

        /* Main Content - Clingy & Emotional */
        .content {
            text-align: center;
            z-index: 10;
            max-width: 700px;
            animation: fade-in 1.5s ease-out;
            background: rgba(255, 255, 255, 0.2);
            padding: 70px 90px;
            border-radius: 35px;
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 25px 70px rgba(255, 130, 206, 0.35);
        }

        @keyframes fade-in {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.85);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .emotional-text {
            font-size: 2.8rem;
            color: #fff;
            font-weight: 700;
            line-height: 1.6;
            letter-spacing: 1px;
            margin-bottom: 30px;
            text-shadow: 0 4px 15px rgba(255, 130, 206, 0.4);
            animation: text-fade 2s ease-out;
        }

        @keyframes text-fade {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .emotional-text::after {
            content: '';
            display: inline-block;
            width: 2px;
            height: 2rem;
            background: #fff;
            margin-left: 8px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50%, 100% {
                opacity: 1;
            }
            51%, 99% {
                opacity: 0;
            }
        }

        .clingy-text {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.95);
            margin: 25px 0;
            font-weight: 500;
            line-height: 1.8;
            animation: slide-in 1.5s ease-out backwards;
        }

        .clingy-text:nth-of-type(1) { animation-delay: 0.3s; }
        .clingy-text:nth-of-type(2) { animation-delay: 0.6s; }

        @keyframes slide-in {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .nav-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 40px;
        }

        .btn {
            padding: 14px 40px;
            font-size: 1.1rem;
            border: 3px solid #fff;
            background: linear-gradient(135deg, #ff82ce, #ff6ac5);
            color: #fff;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s ease;
            text-decoration: none;
            display: inline-block;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(255, 130, 206, 0.35);
        }

        .btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 45px rgba(255, 130, 206, 0.5);
        }

        .btn-back {
            border-color: rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* Floating decorations */
        .floating-emoji {
            position: absolute;
            font-size: 40px;
            opacity: 0.4;
            animation: float-around 8s ease-in-out infinite;
        }

        .emoji1 { top: 10%; left: 5%; animation-delay: 0s; }
        .emoji2 { top: 15%; right: 8%; animation-delay: 1s; }
        .emoji3 { bottom: 25%; right: 5%; animation-delay: 2s; }

        @keyframes float-around {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-40px) rotate(15deg); }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="rain-container" id="rainContainer"></div>
        
        <div class="floating-emoji emoji1">💔</div>
        <div class="floating-emoji emoji2">😢</div>
        <div class="floating-emoji emoji3">💕</div>
        
        <div class="content">
            <div class="emotional-text">I know I hurt you…</div>
            <div class="clingy-text">And it breaks my heart every single day 💔</div>
            <div class="clingy-text">I can't stop thinking about the pain I caused you...</div>
            
            <div class="nav-buttons">
                <a href="index.html" class="btn btn-back">Back</a>
                <a href="page3.html" class="btn">I need you to know... 💝</a>
            </div>
        </div>

        <div class="bunny">😿</div>
    </div>

    <script>
        function createRaindrop() {
            const raindrop = document.createElement('div');
            raindrop.classList.add('raindrop');
            
            const randomX = Math.random() * window.innerWidth;
            const randomDelay = Math.random() * 1;
            const duration = 0.8 + Math.random() * 0.4;
            
            raindrop.style.left = randomX + 'px';
            raindrop.style.top = '-20px';
            raindrop.style.animationDuration = duration + 's';
            raindrop.style.animationDelay = randomDelay + 's';
            
            document.getElementById('rainContainer').appendChild(raindrop);
            
            setTimeout(() => raindrop.remove(), (duration + randomDelay) * 1000);
        }

        setInterval(createRaindrop, 80);
        
        for (let i = 0; i < 25; i++) {
            setTimeout(() => createRaindrop(), i * 30);
        }
    </script>
</body>
</html>
